apiVersion: v1
kind: Service
metadata:
  name: helpdesk-backend-service
  namespace: helpdesk
  labels:
    app: helpdesk-backend
spec:
  type: ClusterIP
  selector:
    app: helpdesk-backend
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-backend-nodeport
  namespace: helpdesk
  labels:
    app: helpdesk-backend
spec:
  type: NodePort
  selector:
    app: helpdesk-backend
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
      protocol: TCP
