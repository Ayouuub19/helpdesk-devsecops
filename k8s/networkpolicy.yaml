apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: helpdesk
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-ingress
  namespace: helpdesk
spec:
  podSelector:
    matchLabels:
      app: helpdesk-backend
  policyTypes:
    - Ingress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress-dns
  namespace: helpdesk
spec:
  podSelector:
    matchLabels:
      app: helpdesk-backend
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress-internet
  namespace: helpdesk
spec:
  podSelector:
    matchLabels:
      app: helpdesk-backend
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
